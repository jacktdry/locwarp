name: macOS verification (manual ARM64 packaging)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: macOS unit tests and frontend build
    # Keep routine CI on the more available Intel runners.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Verify backend unit tests
        run: |
          python3.13 -m pip install -r backend/requirements.txt
          (cd backend && python3.13 -m unittest discover -s tests -v)
      - name: Verify Electron tests and production frontend
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend

  package-arm64:
    name: Manual ARM64 build (ad-hoc signed, NOT notarized)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-15-arm64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Compile, test and verify native ARM64 application
        env:
          LOCWARP_MAC_SIGNING: local
        run: |
          bash build-macos.sh arm64
          codesign --verify --deep --strict frontend/release/mac-arm64/LocWarp.app
          hdiutil verify frontend/release/LocWarp-*-mac-arm64.dmg
          unzip -tq frontend/release/LocWarp-*-mac-arm64.zip
          (cd frontend/release && shasum -a 256 LocWarp-*-mac-arm64.dmg LocWarp-*-mac-arm64.zip > SHA256SUMS.txt)
      - name: Upload artifact (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: locwarp-macos-ARM64-UNNOTARIZED
          path: |
            frontend/release/*-mac-arm64.dmg
            frontend/release/*-mac-arm64.zip
            frontend/release/SHA256SUMS.txt
          retention-days: 7
